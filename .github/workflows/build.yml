name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with app/build.gradle.kts.
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: build-tools;37.0.0
  ANDROID_NDK: ndk;30.0.16248370
  ANDROID_CMAKE: cmake;3.31.6
  RUST_TARGETS: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out, with libchewing and its dictionaries
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$RUST_TARGETS"
          cargo --version

      - name: Cache cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ hashFiles('app/src/main/cpp/libchewing/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install the Android NDK, CMake and SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE" > /dev/null

      - name: Build, test and lint
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Show what cargo changed in libchewing's lock file
        if: always()
        run: git -C app/src/main/cpp/libchewing diff --stat -- Cargo.lock

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kboard-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
          if-no-files-found: ignore

  release:
    name: Publish a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out, with libchewing and its dictionaries
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$RUST_TARGETS"

      - name: Install the Android NDK, CMake and SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE" > /dev/null

      # Signs the release when the repository has a signing key among its secrets
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD); otherwise the APK
      # is published unsigned.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KBOARD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        env:
          KBOARD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KBOARD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KBOARD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleRelease

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
